# The channel narrator (PLAYBOOK §7.5). Owner, 2026-11-03: George (male library voice) dropped; the channel uses its
# own custom ElevenLabs voice, named "1" in the owner's ElevenLabs account. scripts/tts_elevenlabs.py looks the voice
# up by name, so no voice id is stored in this public repo. The API key lives only in the environment
# (ELEVENLABS_API_KEY), never in git, chat or logs.
voice_name: "1"
model_id: eleven_v4                   # owner, 2026-11-03: Eleven v4 replaces Multilingual v2 (spec §5's model)
output_format: mp3_44100_192          # falls back to mp3_44100_128 if the plan does not allow 192 kbps
voice_settings:                       # v4 takes stability and similarity only (no style, no speaker boost)
  stability: 0.0                      # owner, 2026-11-03: "Creative" (the app's three steps: Creative 0.0,
                                      # Natural 0.5, Robust 1.0)
  similarity_boost: 0.80
block_max_chars: 2500
