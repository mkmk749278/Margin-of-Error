# Margin of Error brand tokens (owner's handoff spec §4, PLAYBOOK §6; verbatim spec in PLAYBOOK Part G).
# Scenes read these through lib/remotion/brand.ts (generated by scripts/brand_ts.py); never type a colour by hand.
channel_name: "Margin of Error"
handle: "@marginoferror"          # placeholder until the owner confirms the real handle (PLAYBOOK §17.1)
tagline: "Where accounting meets the laws of physics."
colors:
  # canvas (spec §4: never #000000)
  void: "#0a0d12"        # Void Background: cold ballistic slate
  card: "#121824"        # Card Surface (exhibit mounts, telemetry panels)
  border: "#1e293b"      # 1 px card border
  grid: "#e2e8f0"        # coordinate grid lines; drawn at 0.05 opacity (spec §4 Motion)
  ink: "#e5e7eb"         # primary type on the void
  sub: "#94a3b8"         # secondary type, axis labels
  muted: "#64748b"       # kickers, units, exhibit numbers
  # meaning (colour = meaning, every frame; PLAYBOOK §6.1)
  cyan: "#38bdf8"        # Technical Cyan: nominal systems, schematics, vector paths
  amber: "#f59e0b"       # Warning Amber: stress thresholds, sensor drift, financial callouts
  red: "#ef4444"         # Failure Red: fracture zones, telemetry cutoffs, structural collapse
  # the audited document
  paper: "#f3f4f6"       # Audited Document Surface
  paper_ink: "#111827"   # text set on the paper (our own transcriptions only; real exhibits are scans)
  highlight: "rgba(250, 204, 21, 0.25)"   # authenticated translucent yellow highlight
fonts:                   # vendored OFL fonts (fontsource 5.3.0), PLAYBOOK §6.2. DIN Pro is commercial: Inter it is.
  display: "Inter"             # structural titles: bold, tracked uppercase
  text: "Inter"                # labels, callouts
  mono: "JetBrains Mono"       # telemetry: timestamps, gauges, airspeed, coordinates
video:
  width: 1920            # authoring canvas
  height: 1080
  fps: 60
  render_scale: 2        # 4K master via scale 2; review cuts at 2/3 (720p)
spring:                  # counters and exhibits settle, never snap (spec §4 Motion: continuous interpolation)
  mass: 1.0
  damping: 26
  stiffness: 140
camera:
  perspective: 1000      # px; documents staged in 2.5D (spec §4 Motion)
